services:
  dashboard:
    build: ./apps/dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
  gateway:
    build: ./services/gateway
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:${GATEWAY_HTTP_PORT:-8080}"
    environment:
      GATEWAY_HTTP_PORT: "${GATEWAY_HTTP_PORT:-8080}"
      GATEWAY_GRPC_PORT: "${GATEWAY_GRPC_PORT:-50051}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$GATEWAY_HTTP_PORT/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
  simulator:
    build: ./services/simulator
    environment:
      SATELLITE_ID: "${SATELLITE_ID:-SAT-001}"
      GATEWAY_GRPC_ADDRESS: "gateway:${GATEWAY_GRPC_PORT:-50051}"
      SIMULATOR_INTERVAL_SECONDS: "${SIMULATOR_INTERVAL_SECONDS:-5}"
    init: true
    # No network health check: this scaffold only runs an idle lifecycle loop.

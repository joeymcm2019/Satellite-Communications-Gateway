[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-simulator"
version = "0.1.0"
description = "Local-only satellite simulator skeleton"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
satellite-simulator = "satellite_simulator.__main__:main"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

syntax = "proto3";

package satellite.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/satellite-communications/gateway/gen/satellite/v1;satellitev1";

message SatelliteIdentity {
  string satellite_id = 1;
  string name = 2;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_CONNECTED = 1;
  CONNECTION_STATUS_DISCONNECTED = 2;
}

message SendTelemetryRequest {
  SatelliteIdentity satellite = 1;
  google.protobuf.Timestamp observed_at = 2;
  double battery_percent = 3;
  ConnectionStatus connection_status = 4;
  uint64 sequence_number = 5;
  google.protobuf.Duration expected_interval_seconds = 6;
  bool charging = 7;
}

message Command {
  string command_id = 1;
  string satellite_id = 2;
  string action = 3;
}

message CommandAcknowledgment {
  string command_id = 1;
  string satellite_id = 2;
  bool accepted = 3;
  string detail = 4;
}

message TelemetryReceipt {
  bool accepted = 1;
  string detail = 2;
  uint64 sequence_number = 3;
}

message PingRequest {
  string satellite_id = 1;
}

message PingResponse {
  string satellite_id = 1;
  bool healthy = 2;
}

message SatelliteMessage {
  oneof payload {
    PingResponse ping_response = 1;
    CommandAcknowledgment command_acknowledgment = 2;
  }
}

message GatewayMessage {
  oneof payload {
    PingRequest ping = 1;
    Command command = 2;
  }
}

// Contract placeholder only; no client or server is implemented.
service SatelliteGatewayService {
  rpc SendTelemetry(SendTelemetryRequest) returns (TelemetryReceipt);
  rpc Communicate(stream SatelliteMessage) returns (stream GatewayMessage);
}
